services:
  frontend:
    build:
      context: ..
      dockerfile: apps/frontend/Dockerfile
    environment:
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      API_BASE_URL: https://planwell.online/api
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: apps/backend/Dockerfile
    env_file:
      - ../.env
    environment:
      APP_ENV: staging
      FRONTEND_ORIGIN: https://planwell.online
      SUPPORT_TENANT_REF: staging-demo
      SUPPORT_FAQ_PATH: /app/packages/agent/knowledge/staging-demo/approved-support-faqs.jsonl
      SALES_CATALOG_PATH: /app/packages/agent/knowledge/staging-demo/fictional-sales-catalog.jsonl
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel notice
    volumes:
      - redis_data:/data
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:v1.9.10
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        log_level: info
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: true
        keys:
          ${LIVEKIT_SELF_HOSTED_API_KEY}: ${LIVEKIT_SELF_HOSTED_API_SECRET}
    ports:
      - "7881:7881/tcp"
      - "7882:7882/udp"
    restart: unless-stopped

  realtime-support-agent:
    build:
      context: ../apps/realtime-support-agent
    depends_on:
      - livekit
    env_file:
      - ../.env
    environment:
      LIVEKIT_URL: ws://livekit:7880
      LIVEKIT_API_KEY: ${LIVEKIT_SELF_HOSTED_API_KEY}
      LIVEKIT_API_SECRET: ${LIVEKIT_SELF_HOSTED_API_SECRET}
    restart: unless-stopped

  gateway:
    image: caddy:2-alpine
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
  redis_data:

