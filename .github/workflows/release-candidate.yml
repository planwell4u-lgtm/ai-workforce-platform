name: Release Candidate Artifact

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write
  packages: write

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/ai-workforce-backend
      FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/ai-workforce-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish backend image
        id: backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/backend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Build and publish frontend image
        id: frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Install Cosign
        uses: sigstore/cosign-installer@v3
      - name: Sign published image digests with GitHub OIDC
        run: |
          cosign sign --yes "${BACKEND_IMAGE}@${{ steps.backend.outputs.digest }}"
          cosign sign --yes "${FRONTEND_IMAGE}@${{ steps.frontend.outputs.digest }}"
      - name: Verify keyless signatures
        run: |
          identity="https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release-candidate.yml@.*"
          cosign verify --certificate-identity-regexp="$identity" --certificate-oidc-issuer="https://token.actions.githubusercontent.com" "${BACKEND_IMAGE}@${{ steps.backend.outputs.digest }}"
          cosign verify --certificate-identity-regexp="$identity" --certificate-oidc-issuer="https://token.actions.githubusercontent.com" "${FRONTEND_IMAGE}@${{ steps.frontend.outputs.digest }}"
      - name: Record image digests and source provenance
        run: |
          mkdir -p release
          jq -n \
            --arg source_revision "$GITHUB_SHA" \
            --arg source_repository "$GITHUB_REPOSITORY" \
            --arg workflow_run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            --arg created_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --arg backend_image "${BACKEND_IMAGE}@${{ steps.backend.outputs.digest }}" \
            --arg frontend_image "${FRONTEND_IMAGE}@${{ steps.frontend.outputs.digest }}" \
            '{source_revision: $source_revision, source_repository: $source_repository, workflow_run: $workflow_run, created_at: $created_at, signed_images: [$backend_image, $frontend_image], signing: "sigstore-cosign-keyless-github-oidc"}' \
            > release/provenance.json
      - name: Upload release-candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-workforce-release-${{ github.sha }}
          path: release/
          if-no-files-found: error
          retention-days: 30
