openapi: 3.0.3


info:

  title: Billing Usage API

  description: >
    API for SaaS subscription management,
    usage tracking, metering, billing plans,
    invoices and limits.

  version: 1.0.0



servers:

  - url: https://api.example.com/v1



tags:

  - name: Plans

  - name: Subscriptions

  - name: Usage

  - name: Invoices

  - name: Limits





paths:



  /billing/plans:



    get:



      tags:



        - Plans



      summary: List available subscription plans



      responses:



        "200":



          description: Available plans







  /billing/subscriptions:



    post:



      tags:



        - Subscriptions



      summary: Create tenant subscription



      parameters:



        - $ref: '#/components/parameters/TenantId'



      requestBody:



        content:



          application/json:



            schema:



              $ref: '#/components/schemas/CreateSubscriptionRequest'



      responses:



        "201":



          description: Subscription created







  /billing/subscriptions/current:



    get:



      tags:



        - Subscriptions



      summary: Get current tenant subscription



      parameters:



        - $ref: '#/components/parameters/TenantId'



      responses:



        "200":



          description: Current subscription







  /usage/events:



    post:



      tags:



        - Usage



      summary: Record usage event



      parameters:



        - $ref: '#/components/parameters/TenantId'



      requestBody:



        content:



          application/json:



            schema:



              $ref: '#/components/schemas/UsageEventRequest'



      responses:



        "201":



          description: Usage recorded







  /usage/summary:



    get:



      tags:



        - Usage



      summary: Get usage summary



      parameters:



        - $ref: '#/components/parameters/TenantId'



        - name: period



          in: query



          schema:



            type: string



            example:



              2026-07



      responses:



        "200":



          description: Usage summary







  /billing/invoices:



    get:



      tags:



        - Invoices



      summary: List invoices



      parameters:



        - $ref: '#/components/parameters/TenantId'



      responses:



        "200":



          description: Invoice list







  /billing/limits:



    get:



      tags:



        - Limits



      summary: Get tenant limits



      parameters:



        - $ref: '#/components/parameters/TenantId'



      responses:



        "200":



          description: Plan limits






components:



  parameters:



    TenantId:



      name: X-Tenant-ID



      in: header



      required: true



      schema:



        type: string






  schemas:




    CreateSubscriptionRequest:



      type: object



      required:



        - planId



      properties:



        planId:



          type: string



          example:



            professional



        paymentCustomerId:



          type: string






    Subscription:



      type: object



      properties:



        id:



          type: string



        tenantId:



          type: string



        planId:



          type: string



        status:



          type: string



          enum:



            - active

            - paused

            - cancelled



        startDate:



          type: string



          format: date






    UsageEventRequest:



      type: object



      required:



        - eventType



        - quantity



      properties:



        eventType:



          type: string



          enum:



            - voice_minutes

            - llm_tokens

            - tts_characters

            - stt_minutes

            - storage_mb

            - api_request



        quantity:



          type: number



        conversationId:



          type: string



        agentId:



          type: string



        metadata:



          type: object






    UsageSummary:



      type: object



      properties:



        voiceMinutes:



          type: number



        inputTokens:



          type: integer



        outputTokens:



          type: integer



        storageUsedMb:



          type: number



        estimatedCost:



          type: number






    Invoice:



      type: object



      properties:



        id:



          type: string



        amount:



          type: number



        currency:



          type: string



          example:



            USD



        status:



          type: string



          enum:



            - draft

            - paid

            - overdue



        invoiceDate:



          type: string



          format: date-time