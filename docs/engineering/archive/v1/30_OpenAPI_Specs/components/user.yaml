# user.yaml
components:
  schemas:
    User:
      type: object
      required:
        - id
        - tenant_id
        - email
        - role
        - status
        - created_at
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        first_name:
          type: string
        last_name:
          type: string
        role:
          type: string
          enum:
            - owner
            - admin
            - manager
            - agent
            - viewer
        status:
          type: string
          enum:
            - active
            - inactive
            - suspended
        avatar_url:
          type: string
        created_at:
          type: string
          format: date-time

    UpdateUserRequest:
      type: object
      properties:
        first_name:
          type: string
        last_name:
          type: string
        avatar_url:
          type: string

    AdminUpdateUserRequest:
      type: object
      properties:
        status:
          type: string
          enum:
            - active
            - inactive
            - suspended

    RoleUpdateRequest:
      type: object
      required:
        - role
      properties:
        role:
          type: string
          enum:
            - owner
            - admin
            - manager
            - agent
            - viewer

    Role:
      type: object
      required:
        - id
        - name
        - permissions
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        permissions:
          type: array
          items:
            type: string
