openapi: 3.0.3


info:

  title: Search API

  description: >
    Unified search API for conversations,
    customers, documents, agents, logs and
    semantic retrieval.

  version: 1.0.0



servers:

  - url: https://api.example.com/v1



tags:

  - name: Search

  - name: Semantic Search

  - name: History





paths:



  /search:



    post:



      tags:



        - Search



      summary: Global platform search



      parameters:



        - $ref: '#/components/parameters/TenantId'



      requestBody:



        required: true



        content:



          application/json:



            schema:



              $ref: '#/components/schemas/SearchRequest'



      responses:



        "200":



          description: Search results



          content:



            application/json:



              schema:



                $ref: '#/components/schemas/SearchResponse'







  /search/conversations:



    post:



      tags:



        - Search



      summary: Search conversations and transcripts



      parameters:



        - $ref: '#/components/parameters/TenantId'



      requestBody:



        content:



          application/json:



            schema:



              $ref: '#/components/schemas/SearchRequest'



      responses:



        "200":



          description: Conversation results







  /search/customers:



    post:



      tags:



        - Search



      summary: Search customers



      parameters:



        - $ref: '#/components/parameters/TenantId'



      requestBody:



        content:



          application/json:



            schema:



              $ref: '#/components/schemas/SearchRequest'



      responses:



        "200":



          description: Customer results







  /search/semantic:



    post:



      tags:



        - Semantic Search



      summary: Vector similarity search



      parameters:



        - $ref: '#/components/parameters/TenantId'



      requestBody:



        content:



          application/json:



            schema:



              $ref: '#/components/schemas/SemanticSearchRequest'



      responses:



        "200":



          description: Semantic matches







  /search/history:



    get:



      tags:



        - History



      summary: Get recent searches



      parameters:



        - $ref: '#/components/parameters/TenantId'



      responses:



        "200":



          description: Search history







components:



  parameters:



    TenantId:



      name: X-Tenant-ID



      in: header



      required: true



      schema:



        type: string






  schemas:




    SearchRequest:



      type: object



      required:



        - query



      properties:



        query:



          type: string



          example:



            appointment cancellation



        types:



          type: array



          items:



            type: string



            enum:



              - conversation

              - customer

              - document

              - agent

              - campaign

              - audit



        filters:



          type: object



        limit:



          type: integer



          default: 20






    SearchResponse:



      type: object



      properties:



        query:



          type: string



        total:



          type: integer



        results:



          type: array



          items:



            $ref: '#/components/schemas/SearchResult'







    SearchResult:



      type: object



      properties:



        id:



          type: string



        type:



          type: string



        title:



          type: string



        snippet:



          type: string



        score:



          type: number



        metadata:



          type: object







    SemanticSearchRequest:



      type: object



      required:



        - query



      properties:



        query:



          type: string



        collection:



          type: string



          enum:



            - conversations

            - memories

            - documents



        topK:



          type: integer



          default: 10



        threshold:



          type: number



          default: 0.75