<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="850" viewBox="0 0 1450 850" role="img" aria-labelledby="title desc"><title id="title">Digital Channel Delivery Flow</title><desc id="desc">Digital channel input is validated and normalized before Conversation associates canonical state and Agent produces approved intent. Conversation requests output and Digital Channel records provider or delivery evidence.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#46556b"/></marker></defs><rect width="1450" height="850" fill="#fff"/><g font-family="Arial,sans-serif" fill="#1d2733" text-anchor="middle"><text x="725" y="45" font-size="26" font-weight="700">Digital Channel Delivery Flow</text><g font-size="15" stroke-width="2"><g><rect x="40" y="345" width="230" height="72" rx="12" fill="#fff2cc" stroke="#d6b656"/><text x="155" y="385">Participant / digital provider</text></g><g><rect x="350" y="345" width="315" height="72" rx="12" fill="#d5e8d4" stroke="#82b366"/><text x="507" y="373"><tspan x="507" font-weight="700">Digital Channel Platform</tspan><tspan x="507" dy="20">Validate • consent • normalize • idempotency</tspan></text></g><g><rect x="750" y="345" width="315" height="72" rx="12" fill="#e1d5e7" stroke="#9673a6"/><text x="907" y="373"><tspan x="907" font-weight="700">Conversation Platform</tspan><tspan x="907" dy="20">Canonical interaction • routing • turn authority</tspan></text></g><g><rect x="1155" y="345" width="240" height="72" rx="12" fill="#dae8fc" stroke="#6c8ebf"/><text x="1275" y="373"><tspan x="1275" font-weight="700">Agent Platform</tspan><tspan x="1275" dy="20">Approved reasoning and response intent</tspan></text></g><g><rect x="750" y="555" width="315" height="72" rx="12" fill="#fff2cc" stroke="#d6b656"/><text x="907" y="583"><tspan x="907" font-weight="700">Conversation output request</tspan><tspan x="907" dy="20">Authorized channel and bounded output reference</tspan></text></g><g><rect x="350" y="555" width="315" height="72" rx="12" fill="#d5e8d4" stroke="#82b366"/><text x="507" y="583"><tspan x="507" font-weight="700">Digital Channel delivery</tspan><tspan x="507" dy="20">Provider acceptance / receipt evidence</tspan></text></g><g><rect x="600" y="155" width="460" height="65" rx="12" fill="#f8cecc" stroke="#b85450"/><text x="830" y="183"><tspan x="830" font-weight="700">Security + Foundation</tspan><tspan x="830" dy="20">Trusted identity • tenant • authorization</tspan></text></g><g><rect x="410" y="755" width="720" height="55" rx="10" fill="#f5f5f5" stroke="#666"/><text x="770" y="783"><tspan font-weight="700">Observability + Operations + Testing</tspan><tspan dx="8">Trace • alert/runbook • delivery/recovery assurance</tspan></text></g></g></g><g fill="none" stroke="#46556b" stroke-width="2.5" marker-end="url(#a)"><path d="M270 381H350"/><path d="M665 381H750"/><path d="M1065 381H1155"/><path d="M1275 417V500H907V555"/><path d="M750 591H665"/></g><g fill="none" stroke="#46556b" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#a)"><path d="M830 220V290H907V345"/></g><text x="725" y="690" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#46556b">Provider acceptance and participant delivery are separate outcomes. A channel never creates its own canonical conversation or agent reasoning loop.</text></svg>
