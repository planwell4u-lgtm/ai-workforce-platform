<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="850" viewBox="0 0 1450 850" role="img" aria-labelledby="title desc"><title id="title">Data Lifecycle and Recovery Flow</title><desc id="desc">Domain owners define logical lifecycle intent; Data Platform applies approved persistence and lifecycle mechanisms for active, retained, held, deleted and backed-up representations. Restore requires owner validation and reconciliation.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#46556b"/></marker></defs><rect width="1450" height="850" fill="#fff"/><g font-family="Arial,sans-serif" fill="#1d2733" text-anchor="middle"><text x="725" y="45" font-size="26" font-weight="700">Data Lifecycle and Recovery Flow</text><g font-size="15" stroke-width="2"><g><rect x="40" y="345" width="265" height="72" rx="12" fill="#dae8fc" stroke="#6c8ebf"/><text x="172" y="373"><tspan x="172" font-weight="700">Owning domain</tspan><tspan x="172" dy="20">Logical record and lifecycle intent</tspan></text></g><g><rect x="410" y="345" width="305" height="72" rx="12" fill="#d5e8d4" stroke="#82b366"/><text x="562" y="373"><tspan x="562" font-weight="700">Data Platform</tspan><tspan x="562" dy="20">Approved persistence and lifecycle mechanisms</tspan></text></g><g><rect x="810" y="165" width="275" height="62" rx="12" fill="#fff2cc" stroke="#d6b656"/><text x="947" y="192"><tspan x="947" font-weight="700">Active representation</tspan><tspan x="947" dy="19">Access through owner contracts</tspan></text></g><g><rect x="810" y="315" width="275" height="62" rx="12" fill="#f5f5f5" stroke="#666"/><text x="947" y="342"><tspan x="947" font-weight="700">Retention / archive</tspan><tspan x="947" dy="19">Policy-controlled lifecycle</tspan></text></g><g><rect x="810" y="465" width="275" height="62" rx="12" fill="#f8cecc" stroke="#b85450"/><text x="947" y="492"><tspan x="947" font-weight="700">Legal / security hold</tspan><tspan x="947" dy="19">Restrict deletion or ordinary use</tspan></text></g><g><rect x="810" y="615" width="275" height="62" rx="12" fill="#e1d5e7" stroke="#9673a6"/><text x="947" y="642"><tspan x="947" font-weight="700">Deletion / suppression</tspan><tspan x="947" dy="19">Access stop and physical lifecycle work</tspan></text></g><g><rect x="1160" y="315" width="250" height="62" rx="12" fill="#f5f5f5" stroke="#666"/><text x="1285" y="342"><tspan x="1285" font-weight="700">Backup / recovery artifact</tspan><tspan x="1285" dy="19">Data-owned protection mechanism</tspan></text></g><g><rect x="1160" y="515" width="250" height="62" rx="12" fill="#fff2cc" stroke="#d6b656"/><text x="1285" y="542"><tspan x="1285" font-weight="700">Restore / reconciliation</tspan><tspan x="1285" dy="19">Owner validates canonical outcome</tspan></text></g><g><rect x="430" y="720" width="450" height="55" rx="10" fill="#f8cecc" stroke="#b85450"/><text x="655" y="748"><tspan font-weight="700">Security + Operations</tspan><tspan dx="8">Authorization • incident • evidence</tspan></text></g></g></g><g fill="none" stroke="#46556b" stroke-width="2.5" marker-end="url(#a)"><path d="M305 381H410"/><path d="M715 381H760V196H810"/><path d="M715 381H810"/><path d="M715 381H760V496H810"/><path d="M715 381H760V646H810"/><path d="M1085 346H1160"/><path d="M1285 377V515"/></g><text x="725" y="815" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#46556b">Backup or restore mechanism completion is not by itself proof of canonical data recovery or external-effect reconciliation.</text></svg>
