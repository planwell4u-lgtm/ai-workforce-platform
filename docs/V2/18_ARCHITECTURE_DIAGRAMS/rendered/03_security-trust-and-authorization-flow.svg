<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="850" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc"><title id="title">Security Trust and Authorization Flow</title><desc id="desc">Trusted identity is authenticated, tenant and membership facts are evaluated in authorization policy, then the owning service permits a bounded action or returns safe denial with audit evidence and revocation support.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#46556b"/></marker></defs><rect width="1400" height="850" fill="#fff"/><g font-family="Arial,sans-serif" fill="#1d2733" text-anchor="middle"><text x="700" y="45" font-size="26" font-weight="700">Security Trust and Authorization Flow</text><g font-size="15" stroke-width="2"><g><rect x="40" y="315" width="245" height="72" rx="12" fill="#dae8fc" stroke="#6c8ebf"/><text x="162" y="357">Human / Workload / Provider Identity</text></g><g><rect x="370" y="315" width="250" height="72" rx="12" fill="#f8cecc" stroke="#b85450"/><text x="495" y="343"><tspan x="495" font-weight="700">Security</tspan><tspan x="495" dy="20">Authentication and trust validation</tspan></text></g><g><rect x="700" y="165" width="300" height="72" rx="12" fill="#fff2cc" stroke="#d6b656"/><text x="850" y="193"><tspan x="850" font-weight="700">Platform Foundation</tspan><tspan x="850" dy="20">Tenant • Membership • Entitlement facts</tspan></text></g><g><rect x="700" y="315" width="300" height="72" rx="12" fill="#f8cecc" stroke="#b85450"/><text x="850" y="343"><tspan x="850" font-weight="700">Security</tspan><tspan x="850" dy="20">Authorization policy decision</tspan></text></g><g><rect x="1090" y="315" width="270" height="72" rx="12" fill="#d5e8d4" stroke="#82b366"/><text x="1225" y="343"><tspan x="1225" font-weight="700">Owning API / Service</tspan><tspan x="1225" dy="20">Enforces current allowed action</tspan></text></g><g><rect x="1090" y="505" width="270" height="62" rx="12" fill="#d5e8d4" stroke="#82b366"/><text x="1225" y="532"><tspan x="1225" font-weight="700">Allowed action</tspan><tspan x="1225" dy="19">Bounded domain request</tspan></text></g><g><rect x="700" y="505" width="300" height="62" rx="12" fill="#f8cecc" stroke="#b85450"/><text x="850" y="532"><tspan x="850" font-weight="700">Safe denial / restriction</tspan><tspan x="850" dy="19">No domain effect</tspan></text></g><g><rect x="500" y="690" width="510" height="62" rx="12" fill="#f5f5f5" stroke="#666"/><text x="755" y="717"><tspan x="755" font-weight="700">Audit + Observability</tspan><tspan x="755" dy="19">Approved evidence and correlation</tspan></text></g><g><rect x="40" y="555" width="310" height="62" rx="12" fill="#e1d5e7" stroke="#9673a6"/><text x="195" y="582"><tspan x="195" font-weight="700">Revocation / policy change</tspan><tspan x="195" dy="19">Re-evaluate current decision</tspan></text></g></g></g><g fill="none" stroke="#46556b" stroke-width="2.5" marker-end="url(#a)"><path d="M285 351H370"/><path d="M620 351H700"/><path d="M1000 351H1090"/><path d="M1225 387V505"/><path d="M850 387V505"/></g><g fill="none" stroke="#46556b" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#a)"><path d="M850 237V315"/><path d="M350 586H520V351H700"/></g><text x="700" y="640" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#46556b">Identity, tenant reference, or network location alone is not authorization. Current policy enforcement always decides.</text></svg>
