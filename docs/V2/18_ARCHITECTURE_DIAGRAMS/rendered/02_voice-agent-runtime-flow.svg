<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc"><title id="title">Voice Agent Runtime Flow</title><desc id="desc">Voice participant input is processed by Voice, Conversation and Agent platforms. Knowledge, Memory and Integration support bounded agent work; security and foundation controls apply throughout.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#46556b"/></marker></defs><rect width="1400" height="900" fill="#fff"/><g font-family="Arial,sans-serif" fill="#1d2733" text-anchor="middle"><text x="700" y="45" font-size="26" font-weight="700">Voice Agent Runtime Flow — Bounded Ownership</text><g font-size="15" stroke-width="2"><g><rect x="45" y="350" width="175" height="70" rx="12" fill="#fff2cc" stroke="#d6b656"/><text x="132" y="390">Voice participant</text></g><g><rect x="290" y="340" width="270" height="90" rx="12" fill="#d5e8d4" stroke="#82b366"/><text x="425" y="373"><tspan x="425" font-weight="700">Voice Platform</tspan><tspan x="425" dy="21">Call • Media • STT/TTS • Interruption</tspan></text></g><g><rect x="640" y="340" width="300" height="90" rx="12" fill="#e1d5e7" stroke="#9673a6"/><text x="790" y="373"><tspan x="790" font-weight="700">Conversation Platform</tspan><tspan x="790" dy="21">Canonical session • Turn authority • Routing</tspan></text></g><g><rect x="1030" y="340" width="315" height="90" rx="12" fill="#dae8fc" stroke="#6c8ebf"/><text x="1187" y="373"><tspan x="1187" font-weight="700">Agent Platform</tspan><tspan x="1187" dy="21">Approved Agent Brain • Reasoning • Intent</tspan></text></g><g><rect x="1020" y="570" width="175" height="65" rx="12" fill="#f5f5f5" stroke="#666"/><text x="1107" y="598"><tspan x="1107" font-weight="700">Knowledge</tspan><tspan x="1107" dy="20">Governed retrieval</tspan></text></g><g><rect x="1210" y="570" width="175" height="65" rx="12" fill="#f5f5f5" stroke="#666"/><text x="1297" y="598"><tspan x="1297" font-weight="700">Memory</tspan><tspan x="1297" dy="20">Approved context</tspan></text></g><g><rect x="1030" y="730" width="315" height="70" rx="12" fill="#f8cecc" stroke="#b85450"/><text x="1187" y="758"><tspan x="1187" font-weight="700">Integration Platform</tspan><tspan x="1187" dy="20">Authorized external action</tspan></text></g><g><rect x="505" y="145" width="410" height="65" rx="12" fill="#fff2cc" stroke="#d6b656"/><text x="710" y="173"><tspan x="710" font-weight="700">Security + Foundation</tspan><tspan x="710" dy="20">Trusted tenant • identity • authorization</tspan></text></g><g><rect x="470" y="850" width="690" height="45" rx="10" fill="#f5f5f5" stroke="#666"/><text x="815" y="878"><tspan font-weight="700">Observability + Operations + Testing</tspan><tspan dx="8">Trace • alert/runbook • assurance</tspan></text></g></g></g><g fill="none" stroke="#46556b" stroke-width="2.5" marker-end="url(#a)"><path d="M220 385H290"/><path d="M560 385H640"/><path d="M940 385H1030"/><path d="M1187 430V570H1107"/><path d="M1187 430V570H1297"/><path d="M1187 430V730"/></g><g fill="none" stroke="#46556b" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#a)"><path d="M710 210V290H790V340"/></g><text x="700" y="510" font-family="Arial,sans-serif" font-size="14" text-anchor="middle" fill="#46556b">Voice delivers approved media behavior; Conversation owns the next turn; Agent owns reasoning and intent.</text></svg>
