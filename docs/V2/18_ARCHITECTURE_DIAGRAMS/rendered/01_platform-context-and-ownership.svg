<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">AI Workforce Platform context and ownership</title>
  <desc id="desc">A logical ownership view showing Platform Foundation, Security, Frontend, Channels, Conversation, Agent, Knowledge, Memory, Integration, Data, and cross-platform operations, deployment, observability, and testing.</desc>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 Z" fill="#46556b"/></marker></defs>
  <rect width="1400" height="900" fill="#ffffff"/>
  <text x="700" y="45" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#1d2733">AI Workforce Platform — Context and Ownership</text>
  <g font-family="Arial, sans-serif" font-size="15" text-anchor="middle" fill="#1d2733" stroke-width="2">
    <g><rect x="540" y="80" width="320" height="72" rx="12" fill="#dae8fc" stroke="#6c8ebf"/><text x="700" y="110"><tspan x="700" font-weight="700">Platform Foundation</tspan><tspan x="700" dy="22">Tenant • Membership • Configuration • API Edge</tspan></text></g>
    <g><rect x="55" y="200" width="285" height="72" rx="12" fill="#f8cecc" stroke="#b85450"/><text x="197" y="230"><tspan x="197" font-weight="700">Security Platform</tspan><tspan x="197" dy="22">Identity • Authorization • Secrets • Audit</tspan></text></g>
    <g><rect x="55" y="395" width="285" height="72" rx="12" fill="#fff2cc" stroke="#d6b656"/><text x="197" y="425"><tspan x="197" font-weight="700">Frontend Platform</tspan><tspan x="197" dy="22">Authorized user and operator experience</tspan></text></g>
    <g><rect x="55" y="590" width="285" height="72" rx="12" fill="#d5e8d4" stroke="#82b366"/><text x="197" y="620"><tspan x="197" font-weight="700">Voice + Digital Channels</tspan><tspan x="197" dy="22">Transport • Consent • Delivery evidence</tspan></text></g>
    <g><rect x="465" y="390" width="315" height="86" rx="12" fill="#e1d5e7" stroke="#9673a6"/><text x="622" y="423"><tspan x="622" font-weight="700">Conversation Platform</tspan><tspan x="622" dy="22">Canonical conversation • Routing • Handoff</tspan></text></g>
    <g><rect x="1020" y="390" width="315" height="86" rx="12" fill="#d5e8d4" stroke="#82b366"/><text x="1177" y="423"><tspan x="1177" font-weight="700">Agent Platform</tspan><tspan x="1177" dy="22">One Brain • Behavior • Reasoning • Tool intent</tspan></text></g>
    <g><rect x="860" y="610" width="225" height="66" rx="12" fill="#dae8fc" stroke="#6c8ebf"/><text x="972" y="638"><tspan x="972" font-weight="700">Knowledge Platform</tspan><tspan x="972" dy="20">Governed business information</tspan></text></g>
    <g><rect x="1110" y="610" width="225" height="66" rx="12" fill="#dae8fc" stroke="#6c8ebf"/><text x="1222" y="638"><tspan x="1222" font-weight="700">Memory Platform</tspan><tspan x="1222" dy="20">Governed participant continuity</tspan></text></g>
    <g><rect x="1020" y="745" width="315" height="66" rx="12" fill="#fff2cc" stroke="#d6b656"/><text x="1177" y="773"><tspan x="1177" font-weight="700">Integration Platform</tspan><tspan x="1177" dy="20">Authorized external actions</tspan></text></g>
    <g><rect x="465" y="745" width="315" height="66" rx="12" fill="#f5f5f5" stroke="#666666"/><text x="622" y="773"><tspan x="622" font-weight="700">Data Platform</tspan><tspan x="622" dy="20">Persistence • Lifecycle • Recovery</tspan></text></g>
    <g><rect x="420" y="840" width="915" height="45" rx="10" fill="#f5f5f5" stroke="#666666"/><text x="877" y="868"><tspan font-weight="700">Operations • Deployment • Observability • Testing</tspan><tspan dx="10">Cross-platform operation, delivery, evidence, assurance</tspan></text></g>
  </g>
  <g fill="none" stroke="#46556b" stroke-width="2.5" marker-end="url(#arrow)">
    <path d="M340 431 H420 V116 H540"/><path d="M340 626 H465"/><path d="M780 433 H1020"/><path d="M1177 476 V610 H972"/><path d="M1177 476 V610 H1222"/><path d="M1177 476 V745"/>
  </g>
  <g fill="none" stroke="#46556b" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrow)"><path d="M340 236 H430 V390 H465"/><path d="M700 152 V300 H1177 V390"/></g>
  <text x="700" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" fill="#46556b">Trusted tenant, membership, configuration, and security controls apply across all paths</text>
</svg>
