<svg xmlns="http://www.w3.org/2000/svg" width="1450" height="850" viewBox="0 0 1450 850" role="img" aria-labelledby="title desc"><title id="title">Integration Action and Workflow Flow</title><desc id="desc">Agent intent is authorized and validated before Integration dispatches an idempotent action. Provider outcomes can be uncertain and require reconciliation before a safe next action.</desc><defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L10 3L0 6Z" fill="#46556b"/></marker></defs><rect width="1450" height="850" fill="#fff"/><g font-family="Arial,sans-serif" fill="#1d2733" text-anchor="middle"><text x="725" y="45" font-size="26" font-weight="700">Integration Action and Workflow Flow</text><g font-size="15" stroke-width="2"><g><rect x="40" y="345" width="250" height="72" rx="12" fill="#dae8fc" stroke="#6c8ebf"/><text x="165" y="373"><tspan x="165" font-weight="700">Agent Platform</tspan><tspan x="165" dy="20">Approved action intent</tspan></text></g><g><rect x="380" y="345" width="300" height="72" rx="12" fill="#f8cecc" stroke="#b85450"/><text x="530" y="373"><tspan x="530" font-weight="700">Security + Integration</tspan><tspan x="530" dy="20">Authorization • approval • validation</tspan></text></g><g><rect x="770" y="345" width="300" height="72" rx="12" fill="#d5e8d4" stroke="#82b366"/><text x="920" y="373"><tspan x="920" font-weight="700">Integration Platform</tspan><tspan x="920" dy="20">Idempotent dispatch / workflow</tspan></text></g><g><rect x="1160" y="345" width="230" height="72" rx="12" fill="#fff2cc" stroke="#d6b656"/><text x="1275" y="373"><tspan x="1275" font-weight="700">External provider</tspan><tspan x="1275" dy="20">Bounded request and callback</tspan></text></g><g><rect x="770" y="555" width="300" height="72" rx="12" fill="#e1d5e7" stroke="#9673a6"/><text x="920" y="583"><tspan x="920" font-weight="700">Outcome</tspan><tspan x="920" dy="20">Succeeded • failed • restricted • uncertain</tspan></text></g><g><rect x="1160" y="555" width="230" height="72" rx="12" fill="#f8cecc" stroke="#b85450"/><text x="1275" y="583"><tspan x="1275" font-weight="700">Reconciliation</tspan><tspan x="1275" dy="20">Evidence-based safe next action</tspan></text></g><g><rect x="380" y="555" width="300" height="72" rx="12" fill="#fff2cc" stroke="#d6b656"/><text x="530" y="583"><tspan x="530" font-weight="700">Conversation Platform</tspan><tspan x="530" dy="20">Owns participant-facing continuation</tspan></text></g><g><rect x="390" y="750" width="670" height="55" rx="10" fill="#f5f5f5" stroke="#666"/><text x="725" y="778"><tspan font-weight="700">Audit + Observability + Operations</tspan><tspan dx="8">Evidence • alert/runbook • workflow history</tspan></text></g></g></g><g fill="none" stroke="#46556b" stroke-width="2.5" marker-end="url(#a)"><path d="M290 381H380"/><path d="M680 381H770"/><path d="M1070 381H1160"/><path d="M1275 417V510H920V555"/><path d="M770 591H680"/></g><g fill="none" stroke="#46556b" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#a)"><path d="M1070 591H1160"/></g><text x="725" y="685" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#46556b">An uncertain result is not repeated until reconciliation and current policy permit a safe next action.</text></svg>
